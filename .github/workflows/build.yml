name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build
        required: true
        default: master
      image_tag:
        description: Container image tag
        required: true
        default: latest

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify MySQL migration and partial-DDL recovery
        run: pytest -q tests/test_mysql_device_limit_migration.py

  build-docker-image:
    needs: test-mysql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Resolve immutable release version
        id: release-version
        shell: bash
        run: |
          version_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            version_tag="v$(tr -d '[:space:]' < VERSION)"
            if [[ ! "${version_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid VERSION value: ${version_tag}" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${version_tag}" >/dev/null 2>&1; then
              echo "Release ${version_tag} already exists; bump VERSION before publishing." >&2
              exit 1
            fi
          fi
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./app/dashboard
        run: npm ci

      - name: Build project
        working-directory: ./app/dashboard
        run: VITE_BASE_API=/api/ npm run build --if-present -- --outDir build --assetsDir statics

      - name: Create 404.html
        working-directory: ./app/dashboard
        run: cp ./build/index.html ./build/404.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: image-tags
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marzban
          REQUESTED_TAG: ${{ inputs.image_tag }}
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tags="${IMAGE_NAME}:sha-${short_sha}"
          if [[ -n "${VERSION_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${VERSION_TAG}"$'\n'"${IMAGE_NAME}:latest"
          elif [[ -n "${REQUESTED_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${REQUESTED_TAG}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Create immutable GitHub release
        if: steps.release-version.outputs.version_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION_TAG}" "${GITHUB_SHA}" -m "Marzban ${VERSION_TAG}"
            git push origin "${VERSION_TAG}"
          fi
          gh release view "${VERSION_TAG}" >/dev/null 2>&1 || \
            gh release create "${VERSION_TAG}" \
              --title "Marzban ${VERSION_TAG}" \
              --generate-notes \
              --verify-tag
