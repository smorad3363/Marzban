name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build
        required: true
        default: master
      image_tag:
        description: Container image tag
        required: true
        default: latest

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./app/dashboard
        run: npm ci

      - name: Build project
        working-directory: ./app/dashboard
        run: VITE_BASE_API=/api/ npm run build --if-present -- --outDir build --assetsDir statics

      - name: Create 404.html
        working-directory: ./app/dashboard
        run: cp ./build/index.html ./build/404.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: image-tags
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marzban
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tags="${IMAGE_NAME}:sha-${short_sha}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${GITHUB_REF_NAME}"$'\n'"${IMAGE_NAME}:latest"
          elif [[ -n "${REQUESTED_TAG}" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${REQUESTED_TAG}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Create immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Marzban ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
